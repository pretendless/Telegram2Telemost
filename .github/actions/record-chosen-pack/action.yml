name: Record the chosen pack
description: Save the pack.json this run chose, from the open dialog or the next request.
inputs:
  packs:
    description: Pack numbers for an upload that did not choose a restart pack
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Copy the chosen pack file
      shell: bash
      env:
        PACKS: ${{ inputs.packs }}
      run: node scripts/record_chosen_pack.mjs
    - name: Upload the pack file
      uses: actions/upload-artifact@v4
      with:
        name: pack-record
        path: logs/pack-record/
        if-no-files-found: warn
        retention-days: 90
