# Manual note for tg-project-prompt issues. Live launch is cursor-agent.yml, not this workflow.
name: Project agent (manual)

on:
  repository_dispatch:
    types: [tg-project-prompt]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number (tg-project-prompt)
        required: false
        type: string
      prompt_id:
        description: Worker prompt id (tg-…)
        required: false
        type: string

permissions:
  contents: read
  issues: read

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instructions
        env:
          ISSUE: ${{ github.event.client_payload.issue_number || inputs.issue_number }}
          PROMPT_ID: ${{ github.event.client_payload.prompt_id || inputs.prompt_id }}
        run: |
          echo "This workflow does not call the Cursor API."
          echo "Telegram /project dispatches cursor-agent.yml, which launches a Cloud Agent."
          if [ -n "$ISSUE" ]; then
            echo "Issue: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${ISSUE}"
          fi
          if [ -n "$PROMPT_ID" ]; then
            echo "Worker prompt id: $PROMPT_ID"
          fi
