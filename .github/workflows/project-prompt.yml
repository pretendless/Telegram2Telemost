# Telegram /project → issue + admin TG ack. Full prompt lives in Worker KV (GET /project/prompt).
name: Project prompt

on:
  workflow_dispatch:
    inputs:
      prompt_id:
        description: Prompt id from Worker KV (tg-…)
        required: true
        type: string
      chat_id:
        description: Admin Telegram chat id
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load prompt from Worker KV
        env:
          TG2TM_PROGRESS_URL: ${{ secrets.TG2TM_PROGRESS_URL }}
          UPLOADER_SECRET: ${{ secrets.UPLOADER_SECRET }}
          PROMPT_ID: ${{ inputs.prompt_id }}
          CHAT_ID: ${{ inputs.chat_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/project_prompt_run.mjs
      - name: Create tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(cat project-prompt-title.txt)"
          body="$(cat project-prompt-body.md)"
          url="$(gh issue create --title "$title" --body "$body" --label "tg-project-prompt")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post issue link to admin chat
        env:
          TG2TM_PROGRESS_URL: ${{ secrets.TG2TM_PROGRESS_URL }}
          UPLOADER_SECRET: ${{ secrets.UPLOADER_SECRET }}
          PROMPT_ID: ${{ inputs.prompt_id }}
          CHAT_ID: ${{ inputs.chat_id }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          node - <<'NODE'
          const progressUrl = String(process.env.TG2TM_PROGRESS_URL || "").trim();
          const workerBase = progressUrl.replace(/\/progress\/?$/i, "");
          const secret = process.env.UPLOADER_SECRET || "";
          const id = process.env.PROMPT_ID || "";
          const chatId = process.env.CHAT_ID || "";
          const issueUrl = process.env.ISSUE_URL || "";
          const summary = issueUrl
            ? `Issue для Project: ${issueUrl}\n\nСкопируйте текст из issue в чат Cursor Project или дождитесь cloud agent. Краткий итог пришлёт бот после POST /project/reply.`
            : "Issue создан; ссылка недоступна в этом шаге.";
          fetch(`${workerBase}/project/reply`, {
            method: "POST",
            headers: { authorization: `Bearer ${secret}`, "content-type": "application/json" },
            body: JSON.stringify({ id, chatId: chatId || undefined, summary, issueUrl }),
          }).then((r) => {
            if (!r.ok) {
              console.error("reply http", r.status);
              process.exit(1);
            }
          });
          NODE
