# Telegram /project → fast TG ack, issue + admin TG with links. Prompt in Worker KV (GET /project/prompt).
name: Project prompt

on:
  workflow_dispatch:
    inputs:
      prompt_id:
        description: Prompt id from Worker KV (tg-…)
        required: true
        type: string
      chat_id:
        description: Admin Telegram chat id
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  fast-ack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fast ack to Telegram
        env:
          TG2TM_PROGRESS_URL: ${{ secrets.TG2TM_PROGRESS_URL || 'https://tg2tmbot.prtndz.workers.dev/progress' }}
          UPLOADER_SECRET: ${{ secrets.UPLOADER_SECRET }}
          PROMPT_ID: ${{ inputs.prompt_id }}
          CHAT_ID: ${{ inputs.chat_id }}
          PROJECT_PROMPT_MODE: fast-ack
        run: node scripts/project_prompt_run.mjs

  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load prompt from Worker KV
        env:
          TG2TM_PROGRESS_URL: ${{ secrets.TG2TM_PROGRESS_URL || 'https://tg2tmbot.prtndz.workers.dev/progress' }}
          UPLOADER_SECRET: ${{ secrets.UPLOADER_SECRET }}
          PROMPT_ID: ${{ inputs.prompt_id }}
          CHAT_ID: ${{ inputs.chat_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT_PROMPT_MODE: issue
        run: node scripts/project_prompt_run.mjs
      - name: Create tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(cat project-prompt-title.txt)"
          body="$(cat project-prompt-body.md)"
          url="$(gh issue create --title "$title" --body "$body" --label "tg-project-prompt")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post issue link to admin chat
        env:
          TG2TM_PROGRESS_URL: ${{ secrets.TG2TM_PROGRESS_URL || 'https://tg2tmbot.prtndz.workers.dev/progress' }}
          UPLOADER_SECRET: ${{ secrets.UPLOADER_SECRET }}
          PROMPT_ID: ${{ inputs.prompt_id }}
          CHAT_ID: ${{ inputs.chat_id }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          PROJECT_PROMPT_MODE: issue-notify
        run: node scripts/project_prompt_run.mjs
