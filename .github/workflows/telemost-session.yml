# Start the Telemost browser from a phone or from @tg2tmbot.
# The Run workflow button appears only after this file is on the repository default branch.
# Secrets used here: TELEMOST_SESSION_KEY, TG2TMBOT_TOKEN. GITHUB_TOKEN is automatic.
# PROXY_HOST is optional. Leave it unset to reach Telemost directly.
name: Telemost session

on:
  workflow_dispatch:
    inputs:
      mode:
        description: login opens Yandex ID; upload uses the saved session
        type: choice
        options:
          - login
          - upload
          - finalize
          - restart
        default: login
      account:
        description: Account label, for example default or work
        required: true
        default: default
        type: string
      chat_id:
        description: Telegram chat id that receives the QR code and the browser link
        required: true
        type: string
      packs:
        description: Pack numbers for upload mode, space-separated, for example 03 04
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

# One browser at a time. A second login waits instead of opening another Yandex session.
concurrency:
  group: telemost-session
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        id: in
        env:
          MODE: ${{ inputs.mode }}
          ACCOUNT: ${{ inputs.account }}
          CHAT_ID: ${{ inputs.chat_id }}
          PACKS: ${{ inputs.packs }}
          REQUIRE_CHAT: "1"
        run: node vm/inputs.mjs --github-output >> "$GITHUB_OUTPUT"

      - name: Check session key
        env:
          TELEMOST_SESSION_KEY: ${{ secrets.TELEMOST_SESSION_KEY }}
        run: node --input-type=module -e "import { assertPassphrase } from './vm/session.mjs'; if (!assertPassphrase(process.env.TELEMOST_SESSION_KEY || '')) { console.error('Set secret TELEMOST_SESSION_KEY to a long random string.'); process.exit(1); }"

      - name: Restore encrypted session
        id: session
        if: steps.in.outputs.mode == 'upload' || steps.in.outputs.mode == 'finalize' || steps.in.outputs.mode == 'restart'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACCOUNT: ${{ steps.in.outputs.account }}
          SESSION_DIR: ${{ github.workspace }}/sessions
          MODE: upload
        run: |
          mkdir -p sessions
          node vm/restore_artifact.mjs
          if [ -f "sessions/${ACCOUNT}.tg2tm-session" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Tell Telegram there is no session
        if: (steps.in.outputs.mode == 'upload' || steps.in.outputs.mode == 'finalize' || steps.in.outputs.mode == 'restart') && steps.session.outputs.present != 'yes'
        env:
          MODE: upload
          ACCOUNT: ${{ steps.in.outputs.account }}
          PACKS: ${{ steps.in.outputs.packs }}
          TELEGRAM_CHAT_ID: ${{ steps.in.outputs.chat_id }}
          TG2TMBOT_TOKEN: ${{ secrets.TG2TMBOT_TOKEN }}
        run: node vm/login.mjs notify no-session

      - name: Fetch sticker images
        if: steps.in.outputs.mode == 'upload' && steps.session.outputs.present == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG2TMBOT_TOKEN }}
          PACK_NUMBERS: ${{ steps.in.outputs.packs }}
        run: |
          case "$PACK_NUMBERS" in
            *[!0-9\ ]*) echo "bad packs" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y python3-pil
          # shellcheck disable=SC2086
          python3 scripts/fetch_and_convert.py $PACK_NUMBERS

      - name: Set up Docker Buildx
        if: steps.in.outputs.mode == 'login' || steps.session.outputs.present == 'yes'
        uses: docker/setup-buildx-action@v3

      - name: Build browser image
        if: steps.in.outputs.mode == 'login' || steps.session.outputs.present == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: vm/Dockerfile
          tags: tg2tm-browser
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read the open dialog
        if: steps.in.outputs.mode == 'restart' && steps.session.outputs.present == 'yes'
        env:
          MODE: restart-peek
          ACCOUNT: ${{ steps.in.outputs.account }}
          PACKS: ""
          CHAT_ID: ${{ steps.in.outputs.chat_id }}
          TELEMOST_SESSION_KEY: ${{ secrets.TELEMOST_SESSION_KEY }}
          TG2TMBOT_TOKEN: ${{ secrets.TG2TMBOT_TOKEN }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
        run: |
          mkdir -p sessions logs
          chmod a+rwx logs
          ENABLE_TUNNEL=0
          export ENABLE_TUNNEL
          docker run --rm --shm-size=1g \
            --user "$(id -u):$(id -g)" \
            -e MODE -e ACCOUNT -e PACKS -e ENABLE_TUNNEL -e PROXY_HOST \
            -e GITHUB_ACTIONS \
            -e TELEMOST_SESSION_KEY -e TG2TMBOT_TOKEN \
            -e TELEGRAM_CHAT_ID="$CHAT_ID" \
            -e HOME=/tmp \
            -e SESSION_DIR=/var/lib/tg2tm/sessions \
            -v "$PWD/sessions:/var/lib/tg2tm/sessions" \
            -v "$PWD/packs:/opt/tg2tm/packs" \
            -v "$PWD/logs:/opt/tg2tm/logs" \
            tg2tm-browser

      - name: Prepare the pack this restart will upload
        id: prepare
        if: steps.in.outputs.mode == 'restart' && steps.session.outputs.present == 'yes'
        env:
          UPLOADER_SECRET: ${{ secrets.UPLOADER_SECRET }}
          TG2TM_PROGRESS_URL: https://tg2tmbot.prtndz.workers.dev/progress
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG2TMBOT_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          node scripts/restart_prepare.mjs --github-output >> "$GITHUB_OUTPUT"
          if [ -f logs/restart-fetch.txt ]; then
            python3 scripts/fetch_and_convert.py --dir "$(cat logs/restart-fetch.txt)"
          fi

      - name: Run browser
        if: steps.in.outputs.mode == 'login' || (steps.session.outputs.present == 'yes' && steps.prepare.outputs.action != 'idle')
        env:
          MODE: ${{ steps.in.outputs.mode }}
          ACCOUNT: ${{ steps.in.outputs.account }}
          PACKS: ${{ steps.in.outputs.packs }}
          CHAT_ID: ${{ steps.in.outputs.chat_id }}
          TELEMOST_SESSION_KEY: ${{ secrets.TELEMOST_SESSION_KEY }}
          TG2TMBOT_TOKEN: ${{ secrets.TG2TMBOT_TOKEN }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          UPLOADER_SECRET: ${{ secrets.UPLOADER_SECRET }}
          TG2TM_PROGRESS_URL: https://tg2tmbot.prtndz.workers.dev/progress
        run: |
          mkdir -p sessions logs
          chmod a+rwx logs
          # Main turns the noVNC tunnel on for upload. This pack reached Telemost
          # without it. Keep that off. A browser proxy is used only when PROXY_HOST
          # is set. PROXY_LOGIN and PROXY_PASSWORD are not required.
          ENABLE_TUNNEL=0
          export ENABLE_TUNNEL
          docker run --rm --shm-size=1g \
            --user "$(id -u):$(id -g)" \
            -e MODE -e ACCOUNT -e PACKS -e ENABLE_TUNNEL -e PROXY_HOST \
            -e GITHUB_ACTIONS \
            -e TELEMOST_SESSION_KEY -e TG2TMBOT_TOKEN \
            -e UPLOADER_SECRET -e TG2TM_PROGRESS_URL \
            -e TELEGRAM_CHAT_ID="$CHAT_ID" \
            -e HOME=/tmp \
            -e SESSION_DIR=/var/lib/tg2tm/sessions \
            -v "$PWD/sessions:/var/lib/tg2tm/sessions" \
            -v "$PWD/packs:/opt/tg2tm/packs" \
            -v "$PWD/logs:/opt/tg2tm/logs" \
            tg2tm-browser

      - name: Store encrypted session
        if: success() && (steps.in.outputs.mode == 'login' || steps.session.outputs.present == 'yes')
        uses: actions/upload-artifact@v4
        with:
          name: telemost-session-${{ steps.in.outputs.account }}
          path: sessions/${{ steps.in.outputs.account }}.tg2tm-session
          if-no-files-found: error
          retention-days: 90

      - name: Record pack file
        if: always() && steps.in.outputs.mode == 'finalize'
        uses: actions/upload-artifact@v4
        with:
          name: pack-07-record
          path: packs/07-set-redzh-i-letti/pack.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record pack 08
        if: always() && steps.in.outputs.packs == '08'
        uses: actions/upload-artifact@v4
        with:
          name: pack-08-record
          path: packs/08-maf-izis-i-agnes/pack.json
          if-no-files-found: warn
          retention-days: 90

      - name: Tell admin the run failed
        if: failure()
        env:
          TG2TMBOT_TOKEN: ${{ secrets.TG2TMBOT_TOKEN }}
          MODE: ${{ steps.in.outputs.mode }}
          PACKS: ${{ steps.in.outputs.packs }}
          TELEGRAM_CHAT_ID: ${{ steps.in.outputs.chat_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/admin_status.mjs --run-failed
