name = "tg2tmbot"
main = "src/index.js"
compatibility_date = "2026-10-12"
workers_dev = true

# CLOUDFLARE_ACCOUNT_ID comes from the environment. Do not commit it.
# BOT_KV id is filled in after `wrangler kv namespace create BOT_KV`.

[[kv_namespaces]]
binding = "BOT_KV"
id = "69c9d9f3572a48469a312e5914e8a233"

# Numeric Telegram chat ids with the admin menu and admin commands. Not a credential.
# Optional GH_WORKFLOW_ALLOWLIST = "setup-bot.yml,cursor-agent.yml,check-cursor-api.yml" — if set, /ghrun only those basenames.
# CURSOR_API_KEY stays a GitHub Actions secret. wrangler secret put CURSOR_API_KEY only if this worker calls Cursor itself.
[vars]
LOGIN_CHAT_IDS = "8502935020,5513343655"
